                    var id = 'toast-' + Date.now();
                    var alertClass = type === 'error' ? 'alert-error'

                    var container = document.getElementById('toast-container');

                    container.appendChild(toast);

                    setTimeout(function() {
                        var toastEl = document.getElementById(id);
