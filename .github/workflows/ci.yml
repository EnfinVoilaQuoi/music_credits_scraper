# CI : rejoue les vérifications qualité sur machine vierge à chaque push.
# Intérêt clé (AUDIT §7 point 9) : le runner part d'un checkout PROPRE — la
# classe de bugs « ça marche chez moi car ma vieille base/mes fichiers data/
# masquent le problème » (ex. P0 §3.1) est détectée au premier push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # windows-latest : mêmes conditions que le poste de dev (app Windows-only)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      # Binaires navigateur (le paquet pip playwright n'installe QUE la lib) :
      # requis par test_playwright_manager_async (lance un vrai Chromium headless).
      # `chromium` tire aussi le chrome-headless-shell utilisé par headless=True.
      - name: Installer le navigateur Playwright
        run: playwright install chromium

      - name: Ruff (lint)
        run: ruff check src scripts tests

      - name: Black (formatage)
        run: black --check src scripts tests

      # Garde-fou refacto Phase 4 (couche « domaine ») : le modèle et le mapper
      # n'accèdent JAMAIS à leurs propres champs via getattr/hasattr défensif —
      # un champ manquant doit crasher tôt, pas produire un None trois couches
      # plus loin. Les coercitions DB→objet vivent, elles, dans track_mapper
      # (frontière, seul habitat légal). Empêche le retour du pattern.
      - name: Garde-fou domaine (getattr/hasattr défensif)
        shell: bash
        run: |
          if grep -rnE "getattr\((self|track)|hasattr\((self|track)" src/models/ src/utils/track_mapper.py; then
            echo "::error::getattr/hasattr défensif détecté dans le domaine (src/models ou track_mapper) — accès direct attendu."
            exit 1
          fi
          echo "OK : aucun accès défensif dans le domaine."

      - name: Pytest + couverture
        run: pytest -q --cov=src --cov-report=term-missing:skip-covered

      # Cliquet de couverture, sur le modèle du cliquet per-file-ignores BLE001 :
      # le seuil ne fait que MONTER, tier après tier. Périmètre HORS GUI — le GUI
      # (4 780 statements à 9 %) écraserait le signal et n'est pas au chantier.
      # Paliers franchis : 61 (tier 1) → 65 (tier 2) → 68 (tier 3) → 72 (tier 4)
      # → 74 (tier 5-6 : collecteurs de certifs + chemins d'erreur des repositories)
      # → 77 (tier 7 : les 8 clients d'API, 61 % → 80 % sur `src/api`)
      # → 78 (tier 9 : les providers d'enrichissement et leurs jumeaux ASYNC —
      #      `src/enrichment` 79 % → 93 %, mesuré 78,46 %)
      # → 80 (lot 2 « YouTube » : la table `track_videos` et ses deux updaters,
      #      plus la couverture que le WIP avait DIFFÉRÉE à ce tour global —
      #      `youtube_integration` 26 → 95 %, `track_classifier` 64 → 100 %.
      #      Le report tenait à ce que les décisions allaient changer ; le lot
      #      les a laissées intactes, elles sont donc gelées. Mesuré 81 %).
      # → 81 (2026-09-14 : mesuré 82 % après les services GUI-indépendants et
      #      la CLI ; `dataviz/debug_preview.py` — aperçu matplotlib des CLIs,
      #      0 % et sans logique — sort du périmètre plutôt que d'être couvert).
      # → 84 (2026-09-15, chantier « couverture = prétexte, audit = but » : les
      #      chemins d'erreur des services (74 → 97 %), des scripts de certifs
      #      (BRMA 86, SNEP 95, RIAA 95) et du reliquat utils/observability, lus
      #      deux fois — sept défauts réels corrigés en passant. Mesuré 85 %).
      # Le reste du hors-GUI est du PILOTAGE (navigateur Playwright, flux réseau
      # bout en bout) : le monter davantage demanderait un harnais de session,
      # pas des tests unitaires. Ne remonter ce seuil qu'avec du code réellement
      # couvert, jamais pour « faire un chiffre » — les fabriques paresseuses qui
      # instancient un vrai client réseau restent délibérément non couvertes.
      - name: Cliquet de couverture (hors GUI)
        run: coverage report --omit="src/gui/*,src/main.py,src/dataviz/debug_preview.py" --fail-under=84
